</style><g clip-path="url(#cp)"><rect width="880" height="300" fill="url(#bg)"/><rect width="880" height="300" fill="url(#gr)"/><rect width="880" height="300" fill="url(#gl)"/><text x="40" y="52" class="lb">ABOUT</text><text x="40" y="92" class="h1">I build AI that answers from real data.</text><text x="40" y="128" class="p">AI Engineer in London · MSc Artificial Intelligence, University of East London.</text><text x="40" y="151" class="p">I design retrieval pipelines, wire LLMs into products and ship the interfaces.</text><rect x="40" y="190" width="256" height="76" rx="12" fill="#0f1730" stroke="#2a3558"/><rect x="56" y="208" width="8" height="8" rx="2" fill="#5eead4"/><text x="74" y="217" class="t" style="font:600 16px 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif;fill:#f1f5f9">RAG systems</text><text x="56" y="246" class="ps">Chunking, embeddings, FAISS</text><rect x="312" y="190" width="256" height="76" rx="12" fill="#0f1730" stroke="#2a3558"/><rect x="328" y="208" width="8" height="8" rx="2" fill="#60a5fa"/><text x="346" y="217" class="t" style="font:600 16px 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif;fill:#f1f5f9">LLM apps</text><text x="328" y="246" class="ps">Gemini, LangChain chains</text><rect x="584" y="190" width="256" height="76" rx="12" fill="#0f1730" stroke="#2a3558"/><rect x="600" y="208" width="8" height="8" rx="2" fill="#a78bfa"/><text x="618" y="217" class="t" style="font:600 16px 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif;fill:#f1f5f9">GenAI interfaces</text><text x="600" y="246" class="ps">React, Streamlit, Vercel</text></g><rect x=".5" y=".5" width="879" height="299" rx="15.5" fill="none" stroke="#2a3558"/></svg>
