<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Pranith Manuri, AI Engineer" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="0.55" stop-color="#101935"/>
      <stop offset="1" stop-color="#1a1240"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5eead4"/>
      <stop offset="0.5" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.8" cy="0.4" r="0.5">
      <stop offset="0" stop-color="#6366f1" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.04"/>
    </pattern>
    <clipPath id="frame"><rect width="1200" height="320" rx="18"/></clipPath>
  </defs>
  <style>
    .name { font: 700 64px 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; fill: #f8fafc; letter-spacing: -1.5px; }
    .role { font: 600 22px 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; letter-spacing: 6px; }
    .mono { font: 500 17px 'SFMono-Regular', Consolas, 'Liberation Mono', monospace; fill: #94a3b8; }
    .prompt { fill: #5eead4; }
    .tag { font: 500 17px 'SFMono-Regular', Consolas, 'Liberation Mono', monospace; fill: #e2e8f0; opacity: 0; }
    .t1 { animation: cycle 12s infinite 0s; }
    .t2 { animation: cycle 12s infinite 4s; }
    .t3 { animation: cycle 12s infinite 8s; }
    @keyframes cycle { 0% { opacity: 0; } 4% { opacity: 1; } 30% { opacity: 1; } 34% { opacity: 0; } 100% { opacity: 0; } }
    .cursor { animation: blink 1s steps(1) infinite; fill: #5eead4; }
    @keyframes blink { 50% { opacity: 0; } }
    .edge { stroke: #60a5fa; stroke-opacity: 0.25; stroke-width: 1.2; }
    .flow { stroke: url(#accent); stroke-width: 2; stroke-dasharray: 6 14; fill: none; animation: dash 3s linear infinite; }
    @keyframes dash { to { stroke-dashoffset: -40; } }
    .node { fill: #0f172a; stroke: #60a5fa; stroke-width: 2; }
    .pulse { animation: pulse 3s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    .d1 { animation-delay: .4s; } .d2 { animation-delay: .8s; } .d3 { animation-delay: 1.2s; } .d4 { animation-delay: 1.6s; }
    @keyframes pulse { 0%, 100% { fill: #0f172a; } 50% { fill: #60a5fa; } }
    .lbl { font: 600 12px 'SFMono-Regular', Consolas, monospace; fill: #94a3b8; letter-spacing: 1px; }
    @media (prefers-reduced-motion: reduce) { .t1 { opacity: 1; animation: none; } .t2, .t3 { animation: none; } .flow, .pulse, .cursor { animation: none; } }
  </style>
  <g clip-path="url(#frame)">
    <rect width="1200" height="320" fill="url(#bg)"/>
    <rect width="1200" height="320" fill="url(#grid)"/>
    <rect width="1200" height="320" fill="url(#glow)"/>

    <!-- Left: identity -->
    <text x="64" y="88" class="role" fill="url(#accent)">AI ENGINEER</text>
    <text x="60" y="160" class="name">Pranith Manuri</text>
    <rect x="64" y="184" width="120" height="3" rx="1.5" fill="url(#accent)"/>
    <text x="64" y="232" class="mono"><tspan class="prompt">&gt;</tspan> building</text>
    <text x="172" y="232" class="tag t1">retrieval-augmented generation</text>
    <text x="172" y="232" class="tag t2">LLM-powered products</text>
    <text x="172" y="232" class="tag t3">GenAI interfaces in React</text>
    <text x="64" y="272" class="mono">London, United Kingdom</text>

    <!-- Right: a RAG pipeline drawn as a small network -->
    <g transform="translate(760 70)">
      <path class="edge" d="M20 90 L120 30 M20 90 L120 150 M120 30 L230 90 M120 150 L230 90 M230 90 L340 90"/>
      <path class="flow" d="M20 90 L120 30 L230 90 L340 90"/>
      <path class="flow" d="M20 90 L120 150 L230 90"/>
      <circle class="node pulse" cx="20" cy="90" r="12"/>
      <circle class="node pulse d1" cx="120" cy="30" r="12"/>
      <circle class="node pulse d2" cx="120" cy="150" r="12"/>
      <circle class="node pulse d3" cx="230" cy="90" r="14"/>
      <circle class="node pulse d4" cx="340" cy="90" r="12"/>
      <text class="lbl" x="20" y="124" text-anchor="middle">DOCS</text>
      <text class="lbl" x="120" y="8" text-anchor="middle">EMBED</text>
      <text class="lbl" x="120" y="184" text-anchor="middle">CHUNK</text>
      <text class="lbl" x="230" y="128" text-anchor="middle">RETRIEVE</text>
      <text class="lbl" x="340" y="124" text-anchor="middle">LLM</text>
    </g>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
